apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-api-migration
  namespace: oficina
  labels:
    app: oficina-api
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
          env:
            - name: APP_MODE
              value: migration
