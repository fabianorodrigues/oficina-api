name: oficina-api

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oficina-sqlserver
    profiles:
      - local-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - oficina-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in docker/.env}' -Q 'SELECT 1' -C || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: oficina-smtp4dev
    restart: unless-stopped
    environment:
      ServerOptions__Urls: "http://*:80"
      ServerOptions__HostName: "smtp4dev"
    ports:
      - "127.0.0.1:${SMTP4DEV_WEB_PORT:-5000}:80"
      - "127.0.0.1:${SMTP4DEV_SMTP_PORT:-25}:25"
    volumes:
      - smtp4dev-data:/smtp4dev
    networks:
      - oficina-network

  api:
    image: "${API_IMAGE_REPOSITORY:-oficina-api}:${API_IMAGE_TAG:-local}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: oficina-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__SqlServer: "Server=${SQLSERVER_HOST:-sqlserver},${SQLSERVER_PORT:-1433};Database=${SQLSERVER_DATABASE:-OficinaDb};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in docker/.env};Encrypt=${SQLSERVER_ENCRYPT:-False};TrustServerCertificate=${SQLSERVER_TRUST_SERVER_CERTIFICATE:-True};"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in docker/.env}
      Jwt__Key: ${JWT_SECRET:?Set JWT_SECRET in docker/.env}
      Jwt__Issuer: ${JWT_ISSUER:-Oficina.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Oficina.Api}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-120}
      Jwt__ExpMinutes: ${JWT_EXPIRATION_MINUTES:-120}
      EmailSettings__SmtpHost: ${EMAIL_SMTP_HOST:-smtp4dev}
      EmailSettings__SmtpPort: ${EMAIL_SMTP_PORT:-25}
      EmailSettings__EnableSsl: ${EMAIL_SMTP_ENABLE_SSL:-false}
      EmailSettings__From: ${EMAIL_FROM:-no-reply@oficina.local}
      EmailSettings__Username: ${EMAIL_SMTP_USERNAME:-}
      EmailSettings__Password: ${EMAIL_SMTP_PASSWORD:-}
      EmailSettings__BaseUrlSmtp: ${EMAIL_BASE_URL_SMTP:-http://localhost:${SMTP4DEV_WEB_PORT:-5000}}
      EmailSettings__BaseUrlAprovaRecusaOrcamento: ${EMAIL_BASE_URL_APROVA_RECUSA_ORCAMENTO:-http://localhost:${API_HTTP_PORT:-8080}}
      AdminInicial__Enabled: ${ADMIN_INICIAL_ENABLED:-false}
      AdminInicial__Nome: ${ADMIN_INICIAL_NOME:-}
      AdminInicial__Cpf: ${ADMIN_INICIAL_CPF:-}
      AdminInicial__Senha: ${ADMIN_INICIAL_SENHA:-}
      AdminInicial__MaxTentativas: ${ADMIN_INICIAL_MAX_TENTATIVAS:-12}
      AdminInicial__IntervaloSegundos: ${ADMIN_INICIAL_INTERVALO_SEGUNDOS:-5}
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      smtp4dev:
        condition: service_started
    networks:
      - oficina-network

  migration:
    image: "${API_IMAGE_REPOSITORY:-oficina-api}:${API_IMAGE_TAG:-local}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: oficina-api-migration
    profiles:
      - local-db
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      APP_MODE: migration
      ConnectionStrings__SqlServer: "Server=${SQLSERVER_HOST:-sqlserver},${SQLSERVER_PORT:-1433};Database=${SQLSERVER_DATABASE:-OficinaDb};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in docker/.env};Encrypt=${SQLSERVER_ENCRYPT:-False};TrustServerCertificate=${SQLSERVER_TRUST_SERVER_CERTIFICATE:-True};"
      EmailSettings__SmtpHost: ${EMAIL_SMTP_HOST:-smtp4dev}
      EmailSettings__SmtpPort: ${EMAIL_SMTP_PORT:-25}
      EmailSettings__EnableSsl: ${EMAIL_SMTP_ENABLE_SSL:-false}
      EmailSettings__From: ${EMAIL_FROM:-no-reply@oficina.local}
      EmailSettings__Username: ${EMAIL_SMTP_USERNAME:-}
      EmailSettings__Password: ${EMAIL_SMTP_PASSWORD:-}
      EmailSettings__BaseUrlSmtp: ${EMAIL_BASE_URL_SMTP:-http://localhost:${SMTP4DEV_WEB_PORT:-5000}}
      EmailSettings__BaseUrlAprovaRecusaOrcamento: ${EMAIL_BASE_URL_APROVA_RECUSA_ORCAMENTO:-http://localhost:${API_HTTP_PORT:-8080}}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - oficina-network

networks:
  oficina-network:
    driver: bridge

volumes:
  sqlserver-data:
  smtp4dev-data:
