name: docker-build-push

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish API image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
      IMAGE_ALIAS_TAG: ${{ vars.IMAGE_ALIAS_TAG || 'demo-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_SESSION_TOKEN
            AWS_REGION
            ECR_REPOSITORY_URL
          )

          missing=0
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "${var_name} secret is required."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          if [[ ! "${ECR_REPOSITORY_URL}" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+ ]]; then
            echo "ECR_REPOSITORY_URL must be a full Amazon ECR repository URL."
            exit 1
          fi

          if [[ ! "${IMAGE_ALIAS_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "IMAGE_ALIAS_TAG must be a valid Docker image tag."
            exit 1
          fi

          echo "ECR_REPOSITORY_NAME=${ECR_REPOSITORY_URL##*/}" >> "${GITHUB_ENV}"
          echo "ECR_REGISTRY_URL=${ECR_REPOSITORY_URL%/*}" >> "${GITHUB_ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY_URL}"

      - name: Build API image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f docker/Dockerfile \
            -t "${ECR_REPOSITORY_URL}:${GITHUB_SHA}" \
            -t "${ECR_REPOSITORY_URL}:${IMAGE_ALIAS_TAG}" \
            .

      - name: Check immutable SHA tag
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY_NAME}" \
              --image-ids imageTag="${GITHUB_SHA}" \
              --region "${AWS_REGION}" >/tmp/ecr-sha-image.json 2>/tmp/ecr-sha-error.log; then
            echo "SHA tag already exists in ECR. Skipping immutable tag push."
            echo "SHA_TAG_EXISTS=true" >> "${GITHUB_ENV}"
            exit 0
          fi

          if grep -q "ImageNotFoundException" /tmp/ecr-sha-error.log; then
            echo "SHA tag does not exist in ECR. It will be published."
            echo "SHA_TAG_EXISTS=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          echo "Failed to check SHA tag in ECR."
          exit 1

      - name: Push SHA tag
        if: env.SHA_TAG_EXISTS == 'false'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${ECR_REPOSITORY_URL}:${GITHUB_SHA}"

      - name: Push image alias tag
        shell: bash
        run: |
          set -euo pipefail
          docker push "${ECR_REPOSITORY_URL}:${IMAGE_ALIAS_TAG}"

      - name: Validate published tags
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY_NAME}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region "${AWS_REGION}" >/dev/null

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY_NAME}" \
            --image-ids imageTag="${IMAGE_ALIAS_TAG}" \
            --region "${AWS_REGION}" >/dev/null

          echo "ECR tags validated: commit SHA and ${IMAGE_ALIAS_TAG}."
