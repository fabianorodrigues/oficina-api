name: Deploy API

on:
  workflow_dispatch:
    inputs:
      enable_initial_admin:
        description: "Habilitar criacao controlada do admin inicial nesta execucao"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'oficina' }}

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
      JWT_EXPIRATION_MINUTES: ${{ secrets.JWT_EXPIRATION_MINUTES }}
      ADMIN_INICIAL_NOME: ${{ secrets.ADMIN_INICIAL_NOME }}
      ADMIN_INICIAL_CPF: ${{ secrets.ADMIN_INICIAL_CPF }}
      ADMIN_INICIAL_SENHA: ${{ secrets.ADMIN_INICIAL_SENHA }}
      EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
      EMAIL_ENABLE_SSL: ${{ vars.EMAIL_ENABLE_SSL }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_BASE_URL_APROVA_RECUSA_ORCAMENTO: ${{ vars.EMAIL_BASE_URL_APROVA_RECUSA_ORCAMENTO }}
      EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      ENABLE_INITIAL_ADMIN: ${{ inputs.enable_initial_admin }}

    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            ECR_REPOSITORY_URL
            EKS_CLUSTER_NAME
            DB_CONNECTION_STRING
            JWT_SECRET
            JWT_ISSUER
            JWT_AUDIENCE
            JWT_EXPIRATION_MINUTES
          )

          is_blank() {
            local value="${1:-}"
            [ -z "${value//[[:space:]]/}" ]
          }

          missing=0
          for var_name in "${required_vars[@]}"; do
            if is_blank "${!var_name:-}"; then
              echo "${var_name} is required."
              missing=1
            fi
          done

          if [ "${ENABLE_INITIAL_ADMIN}" != "true" ] && [ "${ENABLE_INITIAL_ADMIN}" != "false" ]; then
            echo "enable_initial_admin must be true or false."
            missing=1
          fi

          if [ "${ENABLE_INITIAL_ADMIN}" = "true" ]; then
            admin_vars=(
              ADMIN_INICIAL_NOME
              ADMIN_INICIAL_CPF
              ADMIN_INICIAL_SENHA
            )

            for var_name in "${admin_vars[@]}"; do
              if [ -z "${!var_name:-}" ]; then
                echo "${var_name} is required when enable_initial_admin=true."
                missing=1
              fi
            done
          fi

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          if [[ ! "${ECR_REPOSITORY_URL}" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+ ]]; then
            echo "ECR_REPOSITORY_URL must be a full Amazon ECR repository URL."
            exit 1
          fi

          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "JWT_SECRET must be at least 32 characters."
            exit 1
          fi

          if [[ ! "${JWT_EXPIRATION_MINUTES}" =~ ^[0-9]+$ ]]; then
            echo "JWT_EXPIRATION_MINUTES must be a positive integer."
            exit 1
          fi

          if [ "${JWT_EXPIRATION_MINUTES}" -le 0 ]; then
            echo "JWT_EXPIRATION_MINUTES must be a positive integer."
            exit 1
          fi

          email_enable_ssl_normalized="$(printf '%s' "${EMAIL_ENABLE_SSL:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "${email_enable_ssl_normalized}" ]; then
            email_enable_ssl_normalized="false"
          fi

          if [ "${email_enable_ssl_normalized}" != "true" ] && [ "${email_enable_ssl_normalized}" != "false" ]; then
            echo "EMAIL_ENABLE_SSL must be true or false."
            exit 1
          fi

          email_smtp_port="${EMAIL_SMTP_PORT:-0}"
          if [ -z "${email_smtp_port}" ]; then
            email_smtp_port="0"
          fi

          if [[ ! "${email_smtp_port}" =~ ^[0-9]+$ ]]; then
            echo "EMAIL_SMTP_PORT must be numeric when configured."
            exit 1
          fi

          smtp_configured=false
          if [ -n "${EMAIL_SMTP_HOST:-}" ] || [ "${email_smtp_port}" -gt 0 ] || [ -n "${EMAIL_FROM:-}" ] || [ -n "${EMAIL_SMTP_USERNAME:-}" ] || [ -n "${EMAIL_SMTP_PASSWORD:-}" ]; then
            smtp_configured=true
          fi

          if [ -n "${EMAIL_SMTP_USERNAME:-}" ] && [ -z "${EMAIL_SMTP_PASSWORD:-}" ]; then
            echo "SMTP username and password must be configured together."
            exit 1
          fi

          if [ -z "${EMAIL_SMTP_USERNAME:-}" ] && [ -n "${EMAIL_SMTP_PASSWORD:-}" ]; then
            echo "SMTP username and password must be configured together."
            exit 1
          fi

          if [ "${smtp_configured}" = "true" ]; then
            if [ -z "${EMAIL_SMTP_HOST:-}" ]; then
              echo "EMAIL_SMTP_HOST is required when SMTP is configured."
              exit 1
            fi

            if [ "${email_smtp_port}" -le 0 ]; then
              echo "EMAIL_SMTP_PORT must be greater than 0 when SMTP is configured."
              exit 1
            fi

            if [ -z "${EMAIL_FROM:-}" ]; then
              echo "EMAIL_FROM is required when SMTP is configured."
              exit 1
            fi

          fi

          echo "Required configuration validated."

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Oficina.sln

      - name: Build solution
        run: dotnet build Oficina.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Oficina.sln --configuration Release --no-build

  publish-image:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - validate
      - build-and-test

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          ecr_registry_url="${ECR_REPOSITORY_URL%/*}"

          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ecr_registry_url}"

      - name: Publish and validate image tags
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          image_uri="${ECR_REPOSITORY_URL}:${GITHUB_SHA}"
          latest_uri="${ECR_REPOSITORY_URL}:latest"
          ecr_repository_name="${ECR_REPOSITORY_URL##*/}"
          ecr_registry_url="${ECR_REPOSITORY_URL%/*}"

          if aws ecr describe-images \
              --repository-name "${ecr_repository_name}" \
              --image-ids imageTag="${GITHUB_SHA}" \
              --region "${AWS_REGION}" >/tmp/ecr-sha-image.json 2>/tmp/ecr-sha-error.log; then
            echo "Commit SHA tag already exists in ECR. Reusing immutable image."
            sha_digest="$(aws ecr describe-images \
              --repository-name "${ecr_repository_name}" \
              --image-ids imageTag="${GITHUB_SHA}" \
              --region "${AWS_REGION}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"

            latest_digest="$(aws ecr describe-images \
              --repository-name "${ecr_repository_name}" \
              --image-ids imageTag=latest \
              --region "${AWS_REGION}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true)"

            if [ "${latest_digest}" = "${sha_digest}" ]; then
              echo "latest already points to the commit SHA image digest."
            else
              aws ecr batch-get-image \
                --repository-name "${ecr_repository_name}" \
                --image-ids imageTag="${GITHUB_SHA}" \
                --region "${AWS_REGION}" \
                --query 'images[0].imageManifest' \
                --output text > /tmp/ecr-sha-manifest.json

              aws ecr put-image \
                --repository-name "${ecr_repository_name}" \
                --image-tag latest \
                --image-manifest file:///tmp/ecr-sha-manifest.json \
                --region "${AWS_REGION}" >/dev/null
            fi
          elif grep -q "ImageNotFoundException" /tmp/ecr-sha-error.log; then
            echo "Commit SHA tag does not exist in ECR. Building and publishing image."
            docker build \
              -f docker/Dockerfile \
              -t "${image_uri}" \
              -t "${latest_uri}" \
              .
            docker push "${image_uri}"
            docker push "${latest_uri}"
          else
            echo "Failed to check commit SHA tag in ECR."
            exit 1
          fi

          sha_digest="$(aws ecr describe-images \
            --repository-name "${ecr_repository_name}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region "${AWS_REGION}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          latest_digest="$(aws ecr describe-images \
            --repository-name "${ecr_repository_name}" \
            --image-ids imageTag=latest \
            --region "${AWS_REGION}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [ -z "${sha_digest}" ] || [ "${sha_digest}" = "None" ]; then
            echo "Commit SHA tag was not found in ECR."
            exit 1
          fi

          if [ -z "${latest_digest}" ] || [ "${latest_digest}" = "None" ]; then
            echo "latest tag was not found in ECR."
            exit 1
          fi

          if [ "${sha_digest}" != "${latest_digest}" ]; then
            echo "latest tag digest differs from commit SHA tag digest."
            exit 1
          fi

          echo "ECR tags validated: commit SHA and latest point to the same digest."

  run-migration:
    name: Run migration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: publish-image

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
      JWT_EXPIRATION_MINUTES: ${{ secrets.JWT_EXPIRATION_MINUTES }}
      ADMIN_INICIAL_NOME: ${{ secrets.ADMIN_INICIAL_NOME }}
      ADMIN_INICIAL_CPF: ${{ secrets.ADMIN_INICIAL_CPF }}
      ADMIN_INICIAL_SENHA: ${{ secrets.ADMIN_INICIAL_SENHA }}
      EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
      EMAIL_ENABLE_SSL: ${{ vars.EMAIL_ENABLE_SSL }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_BASE_URL_APROVA_RECUSA_ORCAMENTO: ${{ vars.EMAIL_BASE_URL_APROVA_RECUSA_ORCAMENTO }}
      EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      ENABLE_INITIAL_ADMIN: ${{ inputs.enable_initial_admin }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Validate Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          kubectl get nodes >/dev/null

          require_can_i() {
            local verb="$1"
            local resource="$2"
            local result
            result="$(kubectl auth can-i "${verb}" "${resource}" -n oficina)"
            if [ "${result}" != "yes" ]; then
              echo "Missing Kubernetes permission: ${verb} ${resource} in namespace oficina."
              exit 1
            fi
          }

          require_can_i get pods
          require_can_i list pods
          require_can_i create jobs
          require_can_i get jobs
          require_can_i delete jobs
          require_can_i create secrets
          require_can_i delete secrets
          require_can_i create configmaps
          require_can_i patch configmaps
          require_can_i update configmaps
          require_can_i create deployments
          require_can_i patch deployments
          require_can_i update deployments
          require_can_i create services
          require_can_i patch services
          require_can_i update services
          require_can_i get services

      - name: Apply ConfigMap
        shell: bash
        run: |
          set -euo pipefail

          email_enable_ssl_normalized="$(printf '%s' "${EMAIL_ENABLE_SSL:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "${email_enable_ssl_normalized}" ]; then
            email_enable_ssl_normalized="false"
          fi

          email_smtp_port="${EMAIL_SMTP_PORT:-0}"
          if [ -z "${email_smtp_port}" ]; then
            email_smtp_port="0"
          fi

          email_base_url="${EMAIL_BASE_URL_APROVA_RECUSA_ORCAMENTO:-}"
          if [ -z "${email_base_url}" ]; then
            email_base_url="$(aws ssm get-parameter \
              --name "/oficina/${ENVIRONMENT}/api/public-base-url" \
              --region "${AWS_REGION}" \
              --query 'Parameter.Value' \
              --output text 2>/dev/null || true)"
            if [ "${email_base_url}" = "None" ]; then
              email_base_url=""
            fi
          fi

          kubectl create configmap oficina-api-config \
            -n oficina \
            --from-literal=ASPNETCORE_ENVIRONMENT=Production \
            --from-literal=ASPNETCORE_URLS=http://+:8080 \
            --from-literal=AdminInicial__Enabled="${ENABLE_INITIAL_ADMIN}" \
            --from-literal=EmailSettings__SmtpHost="${EMAIL_SMTP_HOST:-}" \
            --from-literal=EmailSettings__SmtpPort="${email_smtp_port}" \
            --from-literal=EmailSettings__EnableSsl="${email_enable_ssl_normalized}" \
            --from-literal=EmailSettings__From="${EMAIL_FROM:-}" \
            --from-literal=EmailSettings__BaseUrlAprovaRecusaOrcamento="${email_base_url}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Recreate API Secret
        shell: bash
        run: |
          set -euo pipefail

          kubectl delete secret oficina-api-secret -n oficina --ignore-not-found=true

          secret_args=(
            --from-literal=ConnectionStrings__SqlServer="${DB_CONNECTION_STRING}"
            --from-literal=Jwt__Secret="${JWT_SECRET}"
            --from-literal=Jwt__Issuer="${JWT_ISSUER}"
            --from-literal=Jwt__Audience="${JWT_AUDIENCE}"
            --from-literal=Jwt__ExpirationMinutes="${JWT_EXPIRATION_MINUTES}"
          )

          if [ -n "${EMAIL_SMTP_USERNAME:-}" ] && [ -n "${EMAIL_SMTP_PASSWORD:-}" ]; then
            secret_args+=(
              --from-literal=EmailSettings__Username="${EMAIL_SMTP_USERNAME}"
              --from-literal=EmailSettings__Password="${EMAIL_SMTP_PASSWORD}"
            )
          fi

          if [ "${ENABLE_INITIAL_ADMIN}" = "true" ]; then
            secret_args+=(
              --from-literal=AdminInicial__Nome="${ADMIN_INICIAL_NOME}"
              --from-literal=AdminInicial__Cpf="${ADMIN_INICIAL_CPF}"
              --from-literal=AdminInicial__Senha="${ADMIN_INICIAL_SENHA}"
            )
          fi

          kubectl create secret generic oficina-api-secret \
            -n oficina \
            "${secret_args[@]}"

      - name: Render migration manifest
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ECR_REPOSITORY_URL}" ]; then
            echo "ECR_REPOSITORY_URL is required to render the migration manifest."
            exit 1
          fi

          image_uri="${ECR_REPOSITORY_URL}:${GITHUB_SHA}"

          mkdir -p /tmp/oficina-k8s
          sed "s|__IMAGE__|${image_uri}|g" k8s/migration-job.yaml > /tmp/oficina-k8s/migration-job.yaml

          if grep -R "__IMAGE__" /tmp/oficina-k8s/migration-job.yaml; then
            echo "Rendered migration manifest still contains __IMAGE__ placeholder."
            exit 1
          fi

      - name: Run migration job
        shell: bash
        run: |
          set -euo pipefail

          diagnose_migration() {
            kubectl get job oficina-api-migration -n oficina --no-headers || true
            kubectl get pods -n oficina -l job-name=oficina-api-migration --no-headers || true
          }

          kubectl delete job oficina-api-migration -n oficina --ignore-not-found=true
          kubectl wait --for=delete job/oficina-api-migration -n oficina --timeout=120s || true
          kubectl apply -f /tmp/oficina-k8s/migration-job.yaml

          if ! kubectl wait --for=condition=complete job/oficina-api-migration -n oficina --timeout=300s; then
            echo "Migration job failed or timed out."
            diagnose_migration
            exit 1
          fi

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - publish-image
      - run-migration

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1

      - name: Validate AWS Load Balancer Controller
        shell: bash
        run: |
          set -euo pipefail

          if ! kubectl get deployment aws-load-balancer-controller -n kube-system >/dev/null 2>&1; then
            echo "Falha ao validar AWS Load Balancer Controller."
            exit 1
          fi

          if ! kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=180s >/dev/null 2>&1; then
            echo "Falha ao validar AWS Load Balancer Controller."
            exit 1
          fi

      - name: Render deployment manifest
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ECR_REPOSITORY_URL}" ]; then
            echo "ECR_REPOSITORY_URL is required to render the deployment manifest."
            exit 1
          fi

          image_uri="${ECR_REPOSITORY_URL}:${GITHUB_SHA}"
          vpc_id="$(aws eks describe-cluster \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text 2>/dev/null || true)"

          if [ -z "${vpc_id}" ] || [ "${vpc_id}" = "None" ]; then
            echo "Falha ao validar AWS Load Balancer Controller."
            exit 1
          fi

          vpc_cidr_block="$(aws ec2 describe-vpcs \
            --vpc-ids "${vpc_id}" \
            --region "${AWS_REGION}" \
            --query 'Vpcs[0].CidrBlock' \
            --output text 2>/dev/null || true)"

          if [ -z "${vpc_cidr_block}" ] || [ "${vpc_cidr_block}" = "None" ]; then
            echo "Falha ao validar AWS Load Balancer Controller."
            exit 1
          fi

          mkdir -p /tmp/oficina-k8s
          sed "s|__IMAGE__|${image_uri}|g" k8s/deployment.yaml > /tmp/oficina-k8s/deployment.yaml
          sed "s|__VPC_CIDR_BLOCK__|${vpc_cidr_block}|g" k8s/service.yaml > /tmp/oficina-k8s/service.yaml

          if grep -q "__IMAGE__" /tmp/oficina-k8s/deployment.yaml; then
            echo "Rendered deployment manifest still contains __IMAGE__ placeholder."
            exit 1
          fi

          if grep -q "__VPC_CIDR_BLOCK__" /tmp/oficina-k8s/service.yaml; then
            echo "Rendered service manifest still contains __VPC_CIDR_BLOCK__ placeholder."
            exit 1
          fi

      - name: Apply API workloads
        shell: bash
        run: |
          set -euo pipefail

          diagnose_rollout() {
            kubectl get deployment oficina-api -n oficina --no-headers || true
            kubectl get pods -n oficina -l app=oficina-api --no-headers || true
          }

          kubectl apply -f /tmp/oficina-k8s/deployment.yaml
          kubectl apply -f /tmp/oficina-k8s/service.yaml
          kubectl annotate deployment oficina-api -n oficina redeployTimestamp="$(date +%s)" --overwrite

          if ! kubectl rollout status deployment/oficina-api -n oficina --timeout=300s; then
            echo "API deployment rollout failed or timed out."
            diagnose_rollout
            exit 1
          fi

  validate-deploy:
    name: Validate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - deploy-api

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1

      - name: Validate service and health
        shell: bash
        run: |
          set -euo pipefail

          load_balancer_failure_message="Falha ao localizar LoadBalancer interno da API. Verifique se o AWS Load Balancer Controller possui permissões suficientes no modo configurado."

          diagnose_service() {
            kubectl get svc oficina-api -n oficina -o jsonpath='{.metadata.name}{" type="}{.spec.type}{"\n"}' || true
            kubectl get pods -n oficina -l app=oficina-api --no-headers || true
          }

          lb_hostname=""
          for attempt in {1..80}; do
            lb_hostname="$(kubectl get svc oficina-api -n oficina -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -n "${lb_hostname}" ]; then
              break
            fi

            sleep 15
          done

          if [ -z "${lb_hostname}" ]; then
            echo "${load_balancer_failure_message}"
            exit 1
          fi

          lb_info="$(aws elbv2 describe-load-balancers \
            --region "${AWS_REGION}" \
            --query "LoadBalancers[?DNSName=='${lb_hostname}'].[LoadBalancerArn,Type,Scheme]" \
            --output text || true)"
          read -r lb_arn lb_type lb_scheme <<<"${lb_info}"

          if [ -z "${lb_arn:-}" ] || [ "${lb_arn:-}" = "None" ]; then
            echo "${load_balancer_failure_message}"
            exit 1
          fi

          if [ "${lb_type}" != "network" ] || [ "${lb_scheme}" != "internal" ]; then
            echo "${load_balancer_failure_message}"
            exit 1
          fi

          listener_info="$(aws elbv2 describe-listeners \
            --load-balancer-arn "${lb_arn}" \
            --region "${AWS_REGION}" \
            --query 'Listeners[?Port==`80`].[ListenerArn,DefaultActions[0].TargetGroupArn]' \
            --output text || true)"
          read -r listener_arn target_group_arn <<<"${listener_info}"

          if [ -z "${listener_arn:-}" ] || [ "${listener_arn:-}" = "None" ] || [ -z "${target_group_arn:-}" ] || [ "${target_group_arn:-}" = "None" ]; then
            echo "Falha ao validar listener 80 do LoadBalancer interno."
            exit 1
          fi

          kubectl port-forward svc/oficina-api -n oficina 18080:80 >/tmp/oficina-api-port-forward.log 2>&1 &
          port_forward_pid="$!"
          trap 'kill "${port_forward_pid}" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..60}; do
            if curl -fsS "http://127.0.0.1:18080/health" >/dev/null; then
              echo "Health check succeeded."
              break
            fi

            sleep 10
          done

          if ! curl -fsS "http://127.0.0.1:18080/health" >/dev/null; then
            echo "Health check did not succeed before timeout."
            diagnose_service
            exit 1
          fi

          parameter_name="/oficina/${ENVIRONMENT}/api/backend-listener-arn"
          if aws ssm get-parameter --name "${parameter_name}" --region "${AWS_REGION}" >/dev/null 2>&1; then
            aws ssm put-parameter \
              --name "${parameter_name}" \
              --type String \
              --value "${listener_arn}" \
              --overwrite \
              --region "${AWS_REGION}" >/dev/null
          else
            aws ssm put-parameter \
              --name "${parameter_name}" \
              --type String \
              --value "${listener_arn}" \
              --overwrite \
              --tags Key=Project,Value="${PROJECT_NAME}" Key=Environment,Value="${ENVIRONMENT}" Key=ManagedBy,Value=github-actions \
              --region "${AWS_REGION}" >/dev/null
          fi

          echo "Internal load balancer and health check validated."
