name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Oficina.sln

      - name: Build solution
        run: dotnet build Oficina.sln --configuration Release --no-restore

      - name: Archive build outputs
        run: tar -czf build-outputs.tar.gz src/*/bin/Release src/*/obj tests/*/bin/Release tests/*/obj

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-outputs
          path: build-outputs.tar.gz
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download build outputs
        uses: actions/download-artifact@v6
        with:
          name: build-outputs
          path: .

      - name: Extract build outputs
        run: tar -xzf build-outputs.tar.gz

      - name: Test projects
        shell: bash
        run: |
          set +e
          test_exit_code=0

          for test_project in $(find tests -name "*.csproj" | sort); do
            result_name="$(basename "${test_project%.csproj}").trx"
            dotnet test "$test_project" --configuration Release --no-build --logger "trx;LogFileName=$result_name" --results-directory TestResults
            project_exit_code=$?

            if [ "$project_exit_code" -ne 0 ]; then
              test_exit_code=$project_exit_code
            fi
          done

          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          passed = failed = skipped = total = 0

          for trx_file in glob.glob("TestResults/**/*.trx", recursive=True):
              root = ET.parse(trx_file).getroot()
              counters = root.find(".//{*}Counters")
              if counters is None:
                  continue

              passed += int(counters.attrib.get("passed", 0))
              failed += int(counters.attrib.get("failed", 0))
              skipped += int(counters.attrib.get("notExecuted", 0))
              total += int(counters.attrib.get("total", 0))

          print(f"Tests: {passed}/{total} passed, {failed} failed, {skipped} skipped")
          PY

          exit "$test_exit_code"
